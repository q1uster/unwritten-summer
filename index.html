<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>未写完的夏辞 · 同人 ARG</title>
<meta name="description" content="一个关于等待的同人 ARG。非官方、非商业的虚构作品，与 n-buna / ヨルシカ 无关联。" />
<!-- 站点内部编号：0814 -->
<style>
*,*::before,*::after{box-sizing:border-box}
:root{
  --bg:#070a10;
  --panel:#0b101a;
  --panel-2:#0e1420;
  --ink:#e9e5da;
  --dim:#8d95a7;
  --faint:#5d6577;
  --line:rgba(233,229,218,.13);
  --firefly:#d9e8a4;
  --sea:#a6bccd;
  --moon:#f4eee0;
  --serif:"Songti SC","Noto Serif SC","Source Han Serif SC","Yu Mincho",Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
}
html{scroll-behavior:smooth}
body{
  margin:0;min-height:100%;background:var(--bg);color:var(--ink);
  font-family:var(--sans);font-size:16px;line-height:1.95;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;
  transition:background .9s ease,color .9s ease;
}
body::before{
  content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(1100px 620px at 72% -12%, rgba(120,152,196,.16), transparent 62%),
    radial-gradient(760px 520px at 6% 108%, rgba(96,128,96,.13), transparent 60%),
    radial-gradient(500px 380px at 92% 82%, rgba(217,232,164,.06), transparent 70%);
  transition:opacity .9s ease;
}
#fx{position:fixed;inset:0;z-index:1;pointer-events:none}
.brand,.btn,.tool,.dot,.ghost-link{cursor:pointer}
a{color:inherit}

/* ---------- chrome ---------- */
.topbar{
  position:fixed;top:0;left:0;right:0;z-index:30;
  display:flex;align-items:center;gap:18px;padding:12px 22px;
  background:linear-gradient(to bottom,rgba(7,10,16,.9),rgba(7,10,16,0));
  backdrop-filter:blur(6px);
  transition:background .9s ease,color .9s ease;
}
body[data-route="ch4"] .topbar{background:linear-gradient(to bottom,rgba(243,240,232,.94),rgba(243,240,232,0))}
.brand{font-family:var(--serif);font-size:15px;letter-spacing:.16em;text-decoration:none;opacity:.92}
.dots{display:flex;align-items:center;gap:6px;margin-left:6px}
.dot{
  width:30px;height:30px;border-radius:50%;border:1px solid var(--line);
  background:transparent;color:var(--faint);font-size:12px;line-height:1;
  display:grid;place-items:center;transition:.25s ease;
}
.dot:disabled{opacity:.32;cursor:not-allowed}
.dot.is-done{color:var(--firefly);border-color:rgba(217,232,164,.45)}
.dot.is-here{background:rgba(217,232,164,.14);color:var(--firefly);border-color:var(--firefly)}
.tools{margin-left:auto;display:flex;gap:8px}
.tool{
  border:1px solid var(--line);background:transparent;color:var(--dim);
  font-family:var(--sans);font-size:12px;letter-spacing:.08em;
  padding:7px 13px;border-radius:999px;transition:.25s ease;
}
.tool:hover{color:var(--ink);border-color:rgba(233,229,218,.32)}
body[data-route="ch4"] .tool{color:#55555c;border-color:rgba(38,38,42,.18)}
.site-foot{
  position:relative;z-index:2;display:flex;justify-content:center;align-items:center;gap:16px;
  padding:26px 22px 40px;font-size:11px;letter-spacing:.1em;color:var(--faint);
}
body[data-route="ch4"] .site-foot{color:#8c8a84}
.ghost-link{
  border:0;background:none;color:inherit;font-size:11px;letter-spacing:.18em;
  opacity:.55;padding:4px 6px;transition:.25s;
}
.ghost-link:hover{opacity:1}

/* ---------- shared ---------- */
#app{position:relative;z-index:2}
.screen{max-width:980px;margin:0 auto;padding:118px 24px 70px}
.kicker{
  margin:0 0 18px;font-size:11px;letter-spacing:.42em;color:var(--faint);
  text-transform:uppercase;
}
.title{
  font-family:var(--serif);font-weight:400;font-size:clamp(44px,8vw,78px);
  letter-spacing:.06em;line-height:1.18;margin:0 0 20px;
}
.sub{margin:0 0 40px;color:var(--dim);font-size:15px;letter-spacing:.06em}
.lede{max-width:640px;color:var(--dim);font-size:15.5px}
.lede p{margin:0 0 14px}
.cta-row{display:flex;flex-wrap:wrap;gap:12px;margin:38px 0 0}
.btn{
  font-family:var(--sans);font-size:13.5px;letter-spacing:.12em;
  padding:13px 28px;border-radius:999px;border:1px solid transparent;
  transition:.28s ease;
}
.btn.primary{background:var(--firefly);color:#11150d;font-weight:600}
.btn.primary:hover{transform:translateY(-1px);box-shadow:0 10px 30px rgba(217,232,164,.18)}
.btn.ghost{background:transparent;border-color:var(--line);color:var(--dim)}
.btn.ghost:hover{color:var(--ink);border-color:rgba(233,229,218,.36)}
.btn.small{padding:9px 18px;font-size:12px}
.btn:disabled{opacity:.35;cursor:not-allowed;transform:none;box-shadow:none}
.steps{list-style:none;display:grid;gap:10px;padding:0;margin:56px 0 0;max-width:520px}
.steps li{
  display:flex;align-items:center;gap:14px;font-size:13.5px;color:var(--faint);
  border-bottom:1px dashed var(--line);padding-bottom:10px;letter-spacing:.08em;
}
.steps li span{
  font-family:var(--serif);font-size:12px;color:var(--dim);
  border:1px solid var(--line);border-radius:50%;width:26px;height:26px;
  display:grid;place-items:center;flex:none;
}
.fine{margin:52px 0 0;font-size:12px;line-height:2;color:var(--faint);max-width:660px}
.chapter .ch-head{margin-bottom:34px}
.chapter h2,.room h2{
  font-family:var(--serif);font-weight:400;font-size:clamp(30px,5vw,44px);
  letter-spacing:.08em;margin:0 0 16px;
}
.ch-lede{margin:0;color:var(--dim);max-width:620px;font-size:15px}
.mini{font-size:12.5px;color:var(--faint);letter-spacing:.05em}
body[data-route="ch4"] .kicker,body[data-route="ch4"] .ch-lede{color:#8c8a84}
body[data-route="ch4"] .fine{color:#8c8a84}

/* ---------- chapter 1 ---------- */
.stage{
  position:relative;margin-top:10px;min-height:66vh;padding:38px 30px 46px;
  border:1px solid var(--line);border-radius:18px;overflow:hidden;
  background:
    radial-gradient(700px 340px at 78% 8%, rgba(120,152,196,.10), transparent 68%),
    linear-gradient(180deg, rgba(255,255,255,.022), rgba(255,255,255,.004));
}
.profile-card{max-width:420px}
.avatar{
  width:62px;height:62px;border-radius:50%;margin-bottom:18px;
  background:radial-gradient(circle at 32% 28%, #2b3446, #0c1119 70%);
  border:1px solid rgba(233,229,218,.16);
  filter:grayscale(1);
}
.p-name{font-family:var(--serif);font-size:22px;letter-spacing:.14em}
.p-meta{font-size:11.5px;letter-spacing:.16em;color:var(--faint);margin-top:6px}
.p-note{margin-top:22px;font-size:13.5px;color:var(--dim);letter-spacing:.04em}
.covers{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-top:36px;max-width:620px}
.cover{margin:0}
.cover-art{
  aspect-ratio:1;border-radius:4px;
  background:linear-gradient(150deg,#2a3345,#101622 70%);
  filter:grayscale(1) brightness(.72) contrast(.9);
  border:1px solid rgba(233,229,218,.08);
  transition:filter 1.4s ease, transform .5s ease, box-shadow .6s ease;
}
.cover:nth-child(2) .cover-art{background:linear-gradient(150deg,#2f3a34,#0e1512 70%)}
.cover:nth-child(3) .cover-art{background:linear-gradient(150deg,#3a3340,#14101a 70%)}
.cover:nth-child(4) .cover-art{background:linear-gradient(150deg,#2b3644,#0d1420 70%)}
.cover:nth-child(5) .cover-art{background:linear-gradient(150deg,#3b3330,#181210 70%)}
.cover figcaption{
  margin-top:8px;font-size:10.5px;line-height:1.6;color:var(--faint);
  letter-spacing:.02em;filter:grayscale(1);
}
.stage-tip{position:absolute;left:30px;bottom:20px;margin:0;font-size:11px;letter-spacing:.16em;color:var(--faint);opacity:.6}
.hotspot{
  position:absolute;left:var(--x);top:var(--y);width:86px;height:86px;margin:-43px 0 0 -43px;
  border:0;border-radius:50%;background:transparent;cursor:crosshair;
  display:grid;place-items:center;padding:0;transition:.35s ease;
  -webkit-tap-highlight-color:transparent;
}
.hs-ring{
  width:40px;height:40px;border-radius:50%;
  background:radial-gradient(circle, rgba(217,232,164,.14), rgba(217,232,164,0) 70%);
  transition:.35s ease;
}
.hotspot:hover .hs-ring,.hotspot:focus-visible .hs-ring{transform:scale(1.5);background:radial-gradient(circle, rgba(217,232,164,.30), rgba(217,232,164,0) 72%)}
.hotspot:focus-visible{outline:1px dashed rgba(217,232,164,.5);outline-offset:2px}
.hotspot.is-found{cursor:default;pointer-events:none}
.hotspot.is-found .hs-ring{background:radial-gradient(circle, rgba(217,232,164,.55), rgba(217,232,164,0) 70%);transform:scale(1.35)}
.hotspot.pulse .hs-ring{animation:pulse 1.5s ease-in-out 2}
@keyframes pulse{
  0%,100%{transform:scale(1);background:radial-gradient(circle, rgba(217,232,164,.14), transparent 70%)}
  50%{transform:scale(2);background:radial-gradient(circle, rgba(217,232,164,.45), transparent 72%)}
}
.found{min-height:1px;margin-top:26px;display:grid;gap:6px}
.found-line{
  margin:0;font-family:var(--serif);font-size:14.5px;color:var(--moon);
  letter-spacing:.05em;opacity:0;animation:rise .9s ease forwards;
}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.hint-row{display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin-top:30px}
.hint-text{font-size:12px;color:var(--faint);letter-spacing:.1em}
.reveal-box{
  margin-top:34px;padding:30px 28px;border:1px solid rgba(217,232,164,.28);
  border-radius:14px;background:rgba(217,232,164,.045);
  animation:rise .9s ease forwards;
}
.reveal-kicker{margin:0 0 14px;font-size:10.5px;letter-spacing:.34em;color:var(--firefly);opacity:.85}
.reveal-text{
  margin:0;font-family:var(--serif);font-size:clamp(18px,2.6vw,23px);
  line-height:2.1;letter-spacing:.06em;color:var(--moon);min-height:1.6em;
}
.reveal-text .cursor{display:inline-block;width:1px;height:1em;background:var(--firefly);vertical-align:-.12em;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}

/* ---------- chapter 2 ---------- */
.slots{
  display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:26px 0 22px;
}
.slot{
  min-height:64px;border:1px dashed var(--line);border-radius:10px;
  display:grid;place-items:center;padding:8px;text-align:center;
  font-size:11.5px;color:var(--faint);letter-spacing:.06em;transition:.25s ease;
}
.slot.filled{border-style:solid;border-color:rgba(217,232,164,.34);color:var(--ink);background:rgba(217,232,164,.05)}
.slot-num{display:block;font-family:var(--serif);font-size:10px;color:var(--faint);margin-bottom:2px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-top:18px}
.card{
  text-align:left;border:1px solid var(--line);border-radius:12px;background:var(--panel);
  color:var(--ink);padding:16px 16px 18px;font-family:var(--sans);
  transition:.25s ease;cursor:pointer;position:relative;
}
.card:hover{border-color:rgba(233,229,218,.3);transform:translateY(-2px)}
.card.picked{opacity:.32;pointer-events:none}
.card-title{font-family:var(--serif);font-size:15px;letter-spacing:.05em;display:block;margin-bottom:3px}
.card-meta{font-size:10.5px;color:var(--faint);letter-spacing:.08em;display:block;margin-bottom:10px}
.card-text{font-size:13px;line-height:1.95;color:var(--dim);display:block}
.card-idx{
  position:absolute;top:10px;right:12px;font-family:var(--serif);font-size:11px;
  color:var(--firefly);letter-spacing:.1em;
}
.shake{animation:shake .45s ease}
@keyframes shake{10%,90%{transform:translateX(-2px)}30%,70%{transform:translateX(4px)}50%{transform:translateX(-6px)}}
.toast{
  position:fixed;left:50%;bottom:54px;transform:translate(-50%,14px);z-index:60;
  padding:11px 20px;border-radius:999px;border:1px solid var(--line);
  background:rgba(10,14,22,.92);color:var(--ink);font-size:12.5px;letter-spacing:.1em;
  opacity:0;transition:.4s ease;pointer-events:none;backdrop-filter:blur(8px);
}
.toast.on{opacity:1;transform:translate(-50%,0)}
body[data-route="ch4"] .toast{background:rgba(255,255,255,.94);color:#26262a}

/* ---------- chapter 3 ---------- */
.wave-wrap{margin-top:26px;border:1px solid var(--line);border-radius:14px;padding:16px 16px 10px;background:rgba(255,255,255,.015)}
#wave{display:block;width:100%;height:240px}
.wave-legend{display:flex;gap:20px;padding:6px 4px 4px;font-size:11px;letter-spacing:.14em;color:var(--faint)}
.lg{display:flex;align-items:center;gap:7px}
.lg::before{content:"";width:16px;height:1px;background:currentColor;display:block}
.lg.target{color:rgba(166,188,205,.75)}
.lg.player{color:var(--firefly)}
.controls{display:grid;gap:18px;margin-top:26px;max-width:560px}
.ctl{display:grid;gap:8px;font-size:12.5px;color:var(--dim);letter-spacing:.08em}
.ctl b{color:var(--ink);font-weight:500;font-variant-numeric:tabular-nums}
.ctl input[type=range]{width:100%;accent-color:var(--firefly);height:22px;cursor:pointer;background:transparent}
.meter{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-top:26px;font-size:12px;color:var(--faint);letter-spacing:.1em}
.meter-bar{flex:1;min-width:180px;height:3px;background:rgba(233,229,218,.1);border-radius:2px;overflow:hidden}
.meter-bar i{display:block;height:100%;width:0;background:var(--firefly);transition:width .12s linear}
#heat{color:var(--sea)}
.signal-on #heat{color:var(--firefly)}

/* ---------- chapter 4 ---------- */
body[data-route="ch4"]{background:#f3f0e8;color:#26262a}
body[data-route="ch4"]::before{
  background:
    radial-gradient(1100px 700px at 50% -6%, #ffffff, transparent 66%),
    radial-gradient(900px 620px at 84% 104%, rgba(196,212,228,.55), transparent 72%),
    radial-gradient(700px 520px at 4% 92%, rgba(226,222,198,.75), transparent 70%);
}
.room{max-width:760px;margin:0 auto;padding:130px 26px 80px}
.room .mono{margin-top:40px}
.mono-line{
  margin:0 0 26px;font-family:var(--serif);font-size:clamp(16px,2.3vw,19px);
  line-height:2.15;letter-spacing:.05em;color:#33333a;
  opacity:0;transform:translateY(8px);
}
.mono-line.show{animation:rise 1.1s ease forwards}
.mono-line.strong{font-size:clamp(18px,2.7vw,22px);color:#161619}
.sign{margin:44px 0 0;text-align:right;font-family:var(--serif);letter-spacing:.14em;color:#3a3a40;opacity:0}
.sign.show{animation:rise 1.2s ease forwards}
.sign small{display:block;font-family:var(--sans);font-size:10.5px;letter-spacing:.14em;color:#95938c;margin-top:8px}
.ending-covers{filter:none;max-width:560px;margin:52px auto 0}
.ending-covers .cover-art{filter:grayscale(1) brightness(.82)}
body.returned .ending-covers .cover-art{filter:none;transform:translateY(-2px);box-shadow:0 16px 40px rgba(60,70,90,.14)}
.ending-covers figcaption{filter:grayscale(1);transition:filter 1.6s ease}
body.returned .ending-covers figcaption{filter:none}
.whisper{
  margin:56px 0 0;text-align:center;font-family:var(--serif);
  font-size:clamp(17px,2.6vw,21px);letter-spacing:.1em;color:#2b2b31;min-height:2em;
}
.final-note{max-width:560px;margin:26px auto 0;text-align:center;font-size:12.5px;line-height:2;color:#8b8880}
.returned-note{
  max-width:600px;margin:50px auto 0;text-align:center;font-size:13px;letter-spacing:.1em;color:#6e6b64;
  opacity:0;transition:opacity 1.4s ease;
}
body.returned .returned-note{opacity:1}
.room .btn.ghost{border-color:rgba(38,38,42,.18);color:#5c5a55}
.room .btn.ghost:hover{color:#1d1d20;border-color:rgba(38,38,42,.42)}
.room .btn.primary{background:#26262a;color:#f6f3ea}
.room .reveal-box{background:rgba(255,255,255,.55);border-color:rgba(38,38,42,.16)}
.room .reveal-kicker{color:#8d8a80}
.room .reveal-text{color:#22222a}

/* ---------- modal ---------- */
.modal{
  position:fixed;inset:0;z-index:70;display:grid;place-items:center;padding:24px;
  background:rgba(4,6,10,.72);backdrop-filter:blur(6px);
  opacity:0;transition:opacity .26s ease;
}
.modal[hidden]{display:none}
.modal.on{opacity:1}
.modal-box{
  position:relative;width:min(560px,100%);max-height:82vh;overflow:auto;
  background:var(--panel-2);border:1px solid var(--line);border-radius:16px;
  padding:30px 28px;transform:translateY(8px);transition:transform .26s ease;
  color:var(--ink);
}
.modal.on .modal-box{transform:none}
.modal-box h3{font-family:var(--serif);font-weight:400;font-size:20px;letter-spacing:.12em;margin:0 0 18px}
.modal-box p{font-size:13px;color:var(--dim);line-height:1.95}
.modal-close{
  position:absolute;top:12px;right:12px;width:32px;height:32px;border-radius:50%;
  border:1px solid var(--line);background:transparent;color:var(--dim);font-size:15px;
}
.archive-list{list-style:none;padding:0;margin:0;display:grid;gap:14px}
.archive-list li{border-top:1px dashed var(--line);padding-top:12px}
.archive-list b{display:block;font-family:var(--serif);font-weight:400;font-size:14px;letter-spacing:.05em;color:var(--ink)}
.archive-list span{display:block;font-size:10.5px;letter-spacing:.14em;color:var(--faint);margin-top:4px}
.archive-list li.locked b,.archive-list li.locked span{color:rgba(141,149,167,.4)}
.keypad{display:flex;gap:10px;margin-top:18px}
.keypad input{
  flex:1;background:rgba(255,255,255,.03);border:1px solid var(--line);
  border-radius:10px;color:var(--ink);font-family:var(--serif);
  font-size:22px;letter-spacing:.5em;text-align:center;padding:10px 6px 10px 16px;
}
.keypad input:focus{outline:none;border-color:rgba(217,232,164,.5)}
.egg-art{width:100%;height:auto;display:block;border-radius:8px;margin:6px 0 16px;background:#f7f5ef}
.modal .fine{margin-top:16px}

/* ---------- responsive ---------- */
@media (max-width:720px){
  .screen{padding:96px 18px 56px}
  .topbar{padding:10px 14px;gap:12px}
  .brand{font-size:13px;letter-spacing:.1em}
  .dot{width:26px;height:26px;font-size:11px}
  .tools{gap:6px}
  .tool{padding:6px 10px;font-size:11px}
  .stage{padding:26px 18px 40px;min-height:70vh}
  .covers{grid-template-columns:repeat(3,1fr);gap:10px}
  .cover:nth-child(4),.cover:nth-child(5){display:none}
  .stage-tip{left:18px}
  .hotspot{width:74px;height:74px;margin:-37px 0 0 -37px}
  .slots{grid-template-columns:repeat(5,1fr);gap:6px}
  .slot{font-size:9.5px;min-height:56px;padding:5px}
  .room{padding:104px 20px 60px}
  .ctrl{font-size:11.5px}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}
  html{scroll-behavior:auto}
}
</style>
</head>
<body data-route="home">
<canvas id="fx" aria-hidden="true"></canvas>

<header class="topbar">
  <a class="brand" href="#/home">未写完的夏辞</a>
  <nav class="dots" id="dots" aria-label="章节进度"></nav>
  <div class="tools">
    <button id="btnSound" class="tool" type="button" aria-pressed="false">声 · 关</button>
    <button id="btnArchive" class="tool" type="button">档案</button>
  </div>
</header>

<main id="app"></main>

<footer class="site-foot">
  <span>非官方同人虚构作品 · 与 n-buna / ヨルシカ 无关联</span>
  <button id="btnCode" class="ghost-link" type="button">编号</button>
</footer>

<div id="modal" class="modal" hidden></div>

<script>
/* 未写完的夏辞 —— 同人 ARG（非官方 / 全部为虚构） */
(function () {
  'use strict';

  var $ = function (s, r) { return (r || document).querySelector(s); };
  var $$ = function (s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); };

  var KEY = 'uwsc:v1';
  var CHAPTERS = ['ch1', 'ch2', 'ch3', 'ch4'];
  var LABELS = ['一', '二', '三', '四'];
  var NUM5 = ['一', '二', '三', '四', '五'];
  var TITLES = ['第一章 · 空白主页', '第二章 · 错位的残页', '第三章 · 未完成的音波', '第四章 · 真相房间'];

    var ctx = cv.getContext('2d');
    var w = 0, h = 0, dpr = 1, parts = [], raf = 0, greyUntil = 0, running = false, bound = false;

    function resize() {
      dpr = Math.min(2, window.devicePixelRatio || 1);

      cv.style.width = w + 'px'; cv.style.height = h + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    function seed() {
      parts = [];
      var n = REDUCED ? 14 : 44;
      for (var i = 0; i < n; i++) {
        parts.push({
          x: Math.random() * w,
          y: Math.random() * h,
          r: 0.7 + Math.random() * 1.7,
          a: 0.12 + Math.random() * 0.45,
          vx: (Math.random() - 0.5) * 0.1,
          vy: -0.04 - Math.random() * 0.14,
          ph: Math.random() * Math.PI * 2
        });
      }
    }
    function tick(t) {
      ctx.clearRect(0, 0, w, h);
      var grey = Date.now() < greyUntil;
      var col = grey ? '176,180,186' : '217,232,164';
      for (var i = 0; i < parts.length; i++) {
        var p = parts[i];
        p.x += p.vx; p.y += p.vy;
        if (p.y < -12) { p.y = h + 12; p.x = Math.random() * w; }
        if (p.x < -12) p.x = w + 12;
        if (p.x > w + 12) p.x = -12;
        var tw = 0.55 + 0.45 * Math.sin(t * 0.001 + p.ph);
        var alpha = p.a * tw * (grey ? 0.62 : 1);

        ctx.fillStyle = 'rgba(' + col + ',' + alpha.toFixed(3) + ')';

        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);

      start: start,

      host.dataset.on = '1';
      host.innerHTML = '<div class="reveal-box"><p class="reveal-kicker">碎片 1 / 6</p>' +
        '<p class="reveal-text" id="rv1"></p>' +
        '<div class="cta-row"><button class="btn primary" id="next2" type="button">前往第二章</button></div></div>';
      var line = '「我把声音藏进风里了，你们听见了吗。」';
      if (instant) $('#rv1').textContent = line; else type($('#rv1'), line, 52);
      $('#next2').addEventListener('click', function () { go('ch2'); });
    }

    paintFound();
    if (S.spots.length >= 3) { complete(true); return; }

    $$('.hotspot', stage).forEach(function (btn) {
      btn.addEventListener('click', function (e) {
        e.stopPropagation();
        var id = btn.dataset.spot;
        if (S.spots.indexOf(id) >= 0) return;
        S.spots.push(id); save();
        btn.classList.add('is-found');
        paintFound();
        if (S.spots.length >= 3) {
          $('#hintText').textContent = '三处都亮了。';
          window.setTimeout(function () { complete(false); }, 560);
        }
        else { $('#hintText').textContent = '还有 ' + (3 - S.spots.length) + ' 处没有亮。'; }
      });
    });

    stage.addEventListener('click', function (e) {
      if (e.target.closest('.hotspot')) return;
      wrong += 1;
      if (wrong === 3) {
        $$('.hotspot', stage).forEach(function (b) {
          if (!b.classList.contains('is-found')) {
            b.classList.add('pulse');
            window.setTimeout(function () { b.classList.remove('pulse'); }, 3400);
          }
        });
        $('#hintText').textContent = '有些角落，比正文更亮。';
      }
    });

    $('#hintBtn').addEventListener('click', function () {
      var unfound = $$('.hotspot', stage).filter(function (b) { return !b.classList.contains('is-found'); });
      if (!unfound.length) return;
      var b = unfound[0];
      b.classList.add('pulse');
      window.setTimeout(function () { b.classList.remove('pulse'); }, 3400);
      toast('有一处光，正在呼吸。');
    });
  }

  /* ---------------- chapter 2 ---------------- */
  var PAGES = [
    { id: 'spring', title: '夜明けと蛍', meta: 'n-buna · 2015', text: '天快亮的时候，萤火还在替我数那些没说完的话。' },
    { id: 'summer', title: 'あの夏に咲け', meta: 'ヨルシカ · 2017', text: '草长过了膝盖，把最后一个音节也遮住了。' },
    { id: 'august', title: '八月、某、月明かり', meta: 'ヨルシカ · 2019', text: '八月的月亮，比我更懂得沉默。' },
    { id: 'autumn', title: '雨とカプチーノ', meta: 'ヨルシカ · 2019', text: '雨落进杯子里，甜的苦的，都凉了。' },
    { id: 'winter', title: 'ウミユリ海底譚', meta: 'n-buna · 2014', text: '海底没有季节，只有很久以前的声音。' }
  ];
  var ANSWER = ['spring', 'summer', 'august', 'autumn', 'winter'];

  function shuffle(list) {
    var a = list.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function renderCh2(app) {
    if (done('ch2')) {
      app.innerHTML = '<section class="screen chapter ch2"><header class="ch-head"><p class="kicker">第二章</p><h2>错位的残页</h2>' +
        '<p class="ch-lede">五张残页已经回到它们该在的次序里。</p></header>' +
        '<div class="reveal-box"><p class="reveal-kicker">碎片 2 / 6</p>' +
        '<p class="reveal-text">「我写尽了所有夏天，于是再也没有夏天可写。」</p>' +
        '<div class="cta-row"><button class="btn primary" id="next3" type="button">前往第三章</button></div></div></section>';
      $('#next3').addEventListener('click', function () { go('ch3'); });
      return;
    }

    var shuffled = shuffle(PAGES);
    app.innerHTML = '<section class="screen chapter ch2">' +
      '<header class="ch-head"><p class="kicker">第二章</p><h2>错位的残页</h2>' +
      '<p class="ch-lede">五张残页被打乱了。按「春 → 夏 → 秋 → 冬」的次序，把季节还回去。</p></header>' +
      '<div class="slots" id="slots"></div>' +
      '<div class="cards" id="cards">' + shuffled.map(function (p) {
        return '<button class="card" type="button" data-id="' + p.id + '">' +
          '<span class="card-idx"></span>' +
          '<span class="card-title">' + p.title + '</span>' +
          '<span class="card-meta">' + p.meta + '</span>' +
          '<span class="card-text">' + p.text + '</span></button>';
      }).join('') + '</div>' +
      '<div class="cta-row"><button class="btn primary" id="check" type="button" disabled>确认次序</button>' +
      '<button class="btn ghost" id="resetSeq" type="button">重排</button>' +
      '<button class="btn ghost small" id="hint2" type="button">提示</button></div>' +
      '<p class="mini" id="hint2text" style="margin-top:18px"></p>' +
      '<div id="ch2done"></div>' +
      '</section>';

    var seq = [];

    function paint() {
      $('#slots').innerHTML = ANSWER.map(function (_, i) {
        var id = seq[i];
        var p = null;
        for (var k = 0; k < PAGES.length; k++) if (PAGES[k].id === id) p = PAGES[k];
        return '<div class="slot' + (p ? ' filled' : '') + '"><span class="slot-num">' + NUM5[i] + '</span>' + (p ? p.title : '—') + '</div>';
      }).join('');
      $$('.card').forEach(function (c) {
        var idx = seq.indexOf(c.dataset.id);
        c.classList.toggle('picked', idx >= 0);
        $('.card-idx', c).textContent = idx >= 0 ? (idx + 1) : '';
      });
      $('#check').disabled = seq.length !== ANSWER.length;
    }

    $$('.card').forEach(function (c) {
      c.addEventListener('click', function () {
        if (seq.length >= ANSWER.length) return;
        seq.push(c.dataset.id);
        paint();
      });
    });

    $('#resetSeq').addEventListener('click', function () { seq = []; paint(); });
    $('#hint2').addEventListener('click', function () {
      $('#hint2text').textContent = '春在萤火里，夏在草里，秋在雨里，冬在海底；八月，是夏的最后一页。';
    });

    $('#check').addEventListener('click', function () {
      var ok = ANSWER.every(function (id, i) { return seq[i] === id; });
      if (ok) {
        S.ch.ch2 = true; addFrag('f2'); save(); updateChrome();
        $('#cards').innerHTML = '';
        $('#slots').innerHTML = '';
        var host = $('#ch2done');
        host.innerHTML = '<div class="reveal-box"><p class="reveal-kicker">碎片 2 / 6</p>' +
          '<p class="reveal-text" id="rv2"></p>' +
          '<div class="cta-row"><button class="btn primary" id="next3b" type="button">前往第三章</button></div></div>';
        type($('#rv2'), '「我写尽了所有夏天，于是再也没有夏天可写。」', 52);
        $('#next3b').addEventListener('click', function () { go('ch3'); });
        return;
      }

      S.mistakes += 1; save();
      var cards = $('#cards');
      cards.classList.remove('shake');
      void cards.offsetWidth;
      cards.classList.add('shake');
      toast('次序不对。季节不是这样走的。');

      if (S.mistakes >= 3 && !S.slowSeen) {
        S.slowSeen = true; save();
        FX.grey(7000);
        $('#hint2text').textContent = '别急，我也很慢。';
        $('#hint2text').style.color = 'var(--dim)';
      }
    });

    paint();
  }

  /* ---------------- chapter 3 ---------------- */
  var F0 = 87.9, P0 = 212;

  function renderCh3(app) {
    var complete = done('ch3');
    app.innerHTML = '<section class="screen chapter ch3">' +
      '<header class="ch-head"><p class="kicker">第三章</p><h2>未完成的音波</h2>' +
      '<p class="ch-lede">一段没有对齐的残响。把频率与相位推到重合的位置，听清那句低语。</p></header>' +
      '<div class="wave-wrap"><canvas id="wave" aria-label="两条音波的重合示意"></canvas>' +
      '<div class="wave-legend"><span class="lg target">残响</span><span class="lg player">你的频率</span></div></div>' +
      '<div class="controls">' +
      '<label class="ctl"><span>频率　<b id="fVal">84.0</b> Hz</span><input id="freq" type="range" min="84" max="92" step="0.1" value="84"></label>' +
      '<label class="ctl"><span>相位　<b id="pVal">0</b>°</span><input id="phase" type="range" min="0" max="359" step="1" value="0"></label>' +
      '</div>' +
      '<div class="meter"><div class="meter-bar"><i id="meterFill"></i></div><span id="meterTxt">重合度 0%</span><span id="heat">频率：冷 · 相位：冷</span></div>' +
      '<div class="cta-row"><button class="btn ghost" id="audioBtn" type="button">开启声音</button>' +
      '<button class="btn ghost small" id="hint3" type="button">提示</button></div>' +
      '<p class="mini" id="hint3text" style="margin-top:14px"></p>' +
      '<div id="ch3done"></div>' +
      '</section>';

    var freq = $('#freq'), phase = $('#phase');
    var tuning = false;

    function reveal(instant) {
      S.ch.ch3 = true; addFrag('f3'); save(); updateChrome();
      var host = $('#ch3done');
      if (!host || host.dataset.on) return;
      host.dataset.on = '1';
      var line = '「不是不想写歌，是我暂时找不到世界的声音了。等我重新听见夏天，我就回来。」';
      host.innerHTML = '<div class="reveal-box"><p class="reveal-kicker">碎片 3 / 6</p>' +
        '<p class="reveal-text" id="rv3"></p>' +
        '<div class="cta-row"><button class="btn ghost small" id="speakBtn" type="button">播放低语</button>' +
        '<button class="btn primary" id="next4" type="button">前往第四章</button></div></div>';
      if (instant) $('#rv3').textContent = line; else type($('#rv3'), line, 54);
      $('#speakBtn').addEventListener('click', function () { speak('不是不想写歌，是我暂时找不到世界的声音了。等我重新听见夏天，我就回来。'); });
      $('#next4').addEventListener('click', function () { go('ch4'); });
    }

    if (complete) {
      reveal(true);
      return;
    }

    $('#hint3').addEventListener('click', function () {
      $('#hint3text').textContent = '残响停在 87.9 Hz 附近，相位落在 212° 附近。先调频率，再调相位。';
    });

    $('#audioBtn').addEventListener('click', function () {
      var btn = $('#audioBtn');
      if (!tuning) {
        if (!AudioKit.startTune()) { toast('这个浏览器不支持音频。'); return; }
        tuning = true;
        AudioKit.setTuneFreq(parseFloat(freq.value));
        btn.textContent = '关闭声音';
        btn.setAttribute('aria-pressed', 'true');
      } else {
        AudioKit.stopTune();
        tuning = false;
        btn.textContent = '开启声音';
        btn.setAttribute('aria-pressed', 'false');
      }
    });
    onCleanup(function () {
      if (tuning) AudioKit.stopTune();
      tuning = false;
    });

    var cv = $('#wave');
    var ctx = cv.getContext('2d');
    var w = 0, h = 0, raf = 0, t0 = performance.now(), alignedSince = 0, unlocked = false;

    function resize() {
      var r = cv.getBoundingClientRect();
      var dpr = Math.min(2, window.devicePixelRatio || 1);
      w = Math.max(260, r.width);
      h = r.height || 240;
      cv.width = Math.round(w * dpr);
      cv.height = Math.round(h * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function loop(now) {
      if (!ctx) return;
      var f = parseFloat(freq.value);
      var ph = parseFloat(phase.value);
      var fe = Math.abs(f - F0);
      var pe = Math.abs(ph - P0);
      if (pe > 180) pe = 360 - pe;
      var score = Math.max(0, Math.round((1 - fe / 3.2 - pe / 130) * 100));
      var aligned = fe <= 0.25 && pe <= 6;

      ctx.clearRect(0, 0, w, h);
      var mid = h / 2;
      ctx.strokeStyle = 'rgba(233,229,218,.07)';
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(0, mid); ctx.lineTo(w, mid); ctx.stroke();

      var time = (now - t0) / 1000;
      var amp = Math.min(64, h * 0.26);

      function wave(freqHz, deg, color, width, glow) {
        ctx.beginPath();
        for (var x = 0; x <= w; x += 2) {
          var k = (freqHz / 12) * Math.PI * 2;
          var y = mid + amp * Math.sin((x / w) * k + (deg * Math.PI / 180) + time * 0.32);
          if (x === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        }
        ctx.strokeStyle = color;
        ctx.lineWidth = width;
        ctx.shadowBlur = glow || 0;
        ctx.shadowColor = 'rgba(217,232,164,.55)';
        ctx.stroke();
        ctx.shadowBlur = 0;
      }

      wave(F0, P0, 'rgba(166,188,205,.5)', 1.4, 0);
      wave(f, ph, aligned ? 'rgba(217,232,164,1)' : 'rgba(217,232,164,.82)', 1.8, aligned ? 12 : 0);

      $('#meterFill').style.width = score + '%';
      $('#meterTxt').textContent = '重合度 ' + score + '%';
      $('#heat').textContent = (fe < 0.4 ? '频率：热' : fe < 1.2 ? '频率：温' : '频率：冷') + ' · ' +
        (pe < 8 ? '相位：热' : pe < 30 ? '相位：温' : '相位：冷');
      document.body.classList.toggle('signal-on', aligned);

      if (aligned) {
        if (!alignedSince) alignedSince = now;
        if (now - alignedSince > 1200 && !unlocked) { unlocked = true; finish(); }
      } else alignedSince = 0;

      raf = window.requestAnimationFrame(loop);
    }

    function finish() {
      document.body.classList.remove('signal-on');
      AudioKit.stopTune(); tuning = false;
      var btn = $('#audioBtn');
      if (btn) { btn.textContent = '开启声音'; btn.setAttribute('aria-pressed', 'false'); }
      reveal(false);
      toast('信号重合。有人在说话。', 3200);
    }

    freq.addEventListener('input', function () {
      $('#fVal').textContent = parseFloat(freq.value).toFixed(1);
      if (tuning) AudioKit.setTuneFreq(parseFloat(freq.value));
    });
    phase.addEventListener('input', function () {
      $('#pVal').textContent = Math.round(parseFloat(phase.value));
    });

    resize();
    var onResize = function () { resize(); };
    window.addEventListener('resize', onResize);
    onCleanup(function () { window.removeEventListener('resize', onResize); window.cancelAnimationFrame(raf); document.body.classList.remove('signal-on'); });
    raf = window.requestAnimationFrame(loop);
  }

  /* ---------------- chapter 4 ---------------- */
  var MONO = [
    '很久没有人看见我的更新。',
    '大家以为我消失、倦怠、离开舞台。',
    '其实不是。',
    '我把好几年的情绪、夏夜、烟火、深海、遗憾、温柔，全部掏空给了音乐。',
    '写歌的人，会先耗尽自己的世界。',
    '我没有离开。我只是躲进我曾写过的所有月色里休眠。',
    '等我重新长出新的夏天、新的风、新的情绪，我会带着新的故事，重新出声。',
    '我从未抛弃听众。我只是暂时，与世界静音。'
  ];
  var EGG2 = '「是你们的等待，让我的夏夜没有彻底落幕。」';

  function ch4Finish(app) {
    S.ch.ch4 = true; addFrag('f4'); addFrag('g2'); save(); updateChrome();

    var host = $('#ch4after');
    host.innerHTML = '<div class="covers ending-covers" aria-hidden="true">' + coversMarkup() + '</div>' +
      '<p class="whisper" id="whisper4"></p>' +
      '<div class="cta-row" style="justify-content:center"><button class="btn primary" id="colorBtn" type="button">让颜色回来</button></div>' +
      '<p class="returned-note" id="returnedNote">他正在慢慢回来。</p>' +
      '<div id="finalActions"></div>' +
      '<p class="final-note">本页文字为同人虚构创作，不代表本人发言。真实世界里，请以官方发布为准。</p>';

    type($('#whisper4'), EGG2, 58);

    $('#colorBtn').addEventListener('click', function () {
      S.egg3 = true; save();
      document.body.classList.add('returned');
      var btn = $('#colorBtn');
      btn.disabled = true;
      btn.textContent = '颜色正在回来…';
      window.setTimeout(function () {
        $('#finalActions').innerHTML = '<div class="cta-row" style="justify-content:center">' +
          '<button class="btn ghost" id="toArchive2" type="button">查看档案</button>' +
          '<button class="btn ghost" id="restart2" type="button">再读一次</button></div>';
        $('#toArchive2').addEventListener('click', openArchive);
        $('#restart2').addEventListener('click', function () {
          openModal('<h3>再读一次</h3><p>会清空所有进度与碎片。</p><div class="cta-row">' +
            '<button class="btn primary" id="doReset2" type="button">确定</button>' +
            '<button class="btn ghost" id="noReset2" type="button">算了</button></div>');
          $('#doReset2').addEventListener('click', function () {
            try { localStorage.removeItem(KEY); } catch (e) {}
            S = loadState(); closeModal(); go('home'); render();
          });
          $('#noReset2').addEventListener('click', closeModal);
        });
        btn.style.display = 'none';
      }, 1700);
    });
  }

  function renderCh4(app) {
    var instant = done('ch4');
    app.innerHTML = '<section class="room">' +
      '<p class="kicker">第四章 · 真相房间</p>' +
      '<h2>白色夏夜</h2>' +
      '<p class="ch-lede">所有碎片都在这里了。房间是白的，安静得能听见自己的呼吸。</p>' +
      '<div class="mono">' + MONO.map(function (line, i) {
        var strong = (i === 2 || i === 7) ? ' strong' : '';
        return '<p class="mono-line show' + strong + '" style="animation-delay:' + (0.35 + i * 0.7).toFixed(2) + 's">' + line + '</p>';
      }).join('') + '</div>' +
      '<p class="sign show" style="animation-delay:' + (0.35 + MONO.length * 0.7).toFixed(2) + 's">—— n-buna' +
      '<small>以上为同人虚构文本，非本人发言</small></p>' +
      '<div id="ch4after"></div>' +
      '</section>';

    if (instant) { ch4Finish(app); return; }

    var delay = Math.round((0.35 + MONO.length * 0.7 + 1.1) * 1000);
    var timer = window.setTimeout(function () { ch4Finish(app); }, REDUCED ? 300 : delay);
    onCleanup(function () { window.clearTimeout(timer); });
  }

  /* ---------------- routes ---------------- */
  var ROUTES = {
    home: renderHome,
    ch1: renderCh1,
    ch2: renderCh2,
    ch3: renderCh3,
    ch4: renderCh4
  };

  function render() {
    runCleanups();
    if ('speechSynthesis' in window) { try { window.speechSynthesis.cancel(); } catch (e) {} }
    var r = parseRoute();
    var app = $('#app');
    app.innerHTML = '';
    document.body.dataset.route = r.name;
    document.body.classList.toggle('returned', r.name === 'ch4' && !!S.egg3);
    document.body.classList.remove('signal-on');
    if (!canEnter(r.name)) renderLocked(app, r.name);
    else ROUTES[r.name](app);
    updateChrome();
    window.scrollTo(0, 0);
  }

  /* ---------------- boot ---------------- */
  var soundOn = false;
  function toggleSound() {
    soundOn = !soundOn;
    var ok = AudioKit.setAmbient(soundOn);
    if (!ok) { soundOn = false; toast('这个浏览器不支持音频。'); return; }
    var b = $('#btnSound');
    b.textContent = soundOn ? '声 · 开' : '声 · 关';
    b.setAttribute('aria-pressed', soundOn ? 'true' : 'false');
  }

  $('#btnSound').addEventListener('click', toggleSound);
  $('#btnArchive').addEventListener('click', openArchive);
  $('#btnCode').addEventListener('click', openKeypad);

  if (!location.hash) { try { history.replaceState(null, '', '#/home'); } catch (e) { location.hash = '#/home'; } }
  window.addEventListener('hashchange', render);

  FX.start();
  render();

  try {
    console.log('%c未写完的夏辞', 'color:#d9e8a4;font-size:14px;letter-spacing:2px');
    console.log('有些编号，不该被写进正文。');
  } catch (e) {}
})();
</script>
